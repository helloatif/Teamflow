name: Continuous Integration

on:
  push:
    branches:
      - main
      - docs-and-production
  pull_request:
    branches:
      - main
      - docs-and-production

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamflow?schema=public
      JWT_SECRET: ci-access-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-thirty-two-characters
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test
